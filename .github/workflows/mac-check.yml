# Test-only: runs a Forge Mac download on GitHub's Mac runners (Relay tasks 678
# and 1391). Lives on the mac-check branch of the releases repository only, as
# .github/workflows/mac-check.yml beside mac-check/check.py and expected.json;
# main and the download page are untouched. Standard macOS runners are free on
# a public repository: Apple silicon (M1) and Intel, macOS 15 and 26.
name: Mac check
on:
  push:
    branches: [mac-check]
  workflow_dispatch:
permissions:
  contents: write  # needed only to read a draft (unpublished) release
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-26, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: macos-26-intel, target: macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the download
        run: python3 mac-check/check.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check-${{ matrix.os }}
          path: out
